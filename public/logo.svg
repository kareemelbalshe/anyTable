<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Inner Table Card Background -->
  <rect x="18" y="24" width="92" height="80" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1.5" />

  <!-- Table Header Bar -->
  <path d="M 18 36 C 18 29.37 23.37 24 30 24 L 98 24 C 104.63 24 110 29.37 110 36 L 110 44 L 18 44 Z" fill="url(#headerGrad)" />

  <!-- Header Column Elements -->
  <rect x="26" y="31" width="22" height="6" rx="3" fill="#ffffff" fill-opacity="0.95" />
  <rect x="55" y="31" width="22" height="6" rx="3" fill="#ffffff" fill-opacity="0.65" />
  <rect x="83" y="31" width="20" height="6" rx="3" fill="#ffffff" fill-opacity="0.65" />

  <!-- Row 1 -->
  <rect x="26" y="52" width="14" height="14" rx="4" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="1.2" />
  <path d="M 30 59 L 33 62 L 39 55" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="47" y="55" width="28" height="8" rx="4" fill="#60a5fa" fill-opacity="0.9" />
  <rect x="81" y="54" width="22" height="10" rx="5" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.2" />
  <circle cx="86" cy="59" r="2.2" fill="#10b981" />
  <rect x="91" y="57" width="9" height="4" rx="2" fill="#10b981" />

  <!-- Row Divider -->
  <line x1="22" y1="72" x2="106" y2="72" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />

  <!-- Row 2 -->
  <rect x="26" y="79" width="14" height="14" rx="4" fill="#818cf8" fill-opacity="0.25" stroke="#818cf8" stroke-width="1.2" />
  <circle cx="33" cy="86" r="3" fill="#818cf8" />
  <rect x="47" y="82" width="32" height="8" rx="4" fill="#94a3b8" fill-opacity="0.75" />
  <rect x="85" y="81" width="18" height="10" rx="5" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.2" />
  <rect x="89" y="84" width="10" height="4" rx="2" fill="#38bdf8" />

  <!-- Autonomous Sparkle Star (Top Right Corner) -->
  <g transform="translate(100, 16)" filter="url(#glow)">
    <path d="M 0 -9 Q 0 0 9 0 Q 0 0 0 9 Q 0 0 -9 0 Q 0 0 0 -9 Z" fill="url(#accentSpark)" />
    <circle cx="0" cy="0" r="1.8" fill="#ffffff" />
  </g>
</svg>
